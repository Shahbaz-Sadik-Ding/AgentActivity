name: Release

# Every push to main builds the Windows app and publishes a new GitHub Release.
# Version = major.minor from package.json + the workflow run number as patch (e.g. 0.1.7).
# Bump major/minor by editing "version" in package.json.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Stamp the exe with the release version.
      - run: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm run package

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path release/AgentActivity -DestinationPath "AgentActivity-v${{ steps.ver.outputs.version }}-win-x64.zip"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "AgentActivity-v${{ steps.ver.outputs.version }}-win-x64.zip" \
            --target "${{ github.sha }}" \
            --title "Agent Activity v${{ steps.ver.outputs.version }}" \
            --generate-notes
